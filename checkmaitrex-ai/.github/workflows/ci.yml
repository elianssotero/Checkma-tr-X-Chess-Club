name: CheckmaîtréX AI

on:
  push:
    branches: ["phase8-recovery-integration"]
  pull_request:
    branches: ["phase8-recovery-integration"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: ./checkmaitrex-ai
        run: npm install --no-fund --no-audit
      - name: Run tests
        working-directory: ./checkmaitrex-ai
        run: npm test
