
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0c">
  <title>Admin Dashboard | CheckmaîtréX Chess Club</title>
  <style>
    :root {
      --bg: #0a0a0c;
      --panel: #121216;
      --card: #18181e;
      --card-hover: #202027;
      --border: #303038;
      --gold: #d4af37;
      --gold-light: #f3d77a;
      --text: #f5f5f7;
      --muted: #a2a2af;
      --green: #50c99a;
      --amber: #e9a23b;
      --blue: #70a7ff;
      --sidebar-width: 270px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      font-size: 14px;
    }
    button { font: inherit; }
    button:focus-visible, a:focus-visible {
      outline: 2px solid var(--gold-light);
      outline-offset: 3px;
    }

    .layout { min-height: 100vh; }
    .sidebar {
      width: var(--sidebar-width);
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      background: #101014;
      border-right: 1px solid var(--border);
      overflow-y: auto;
    }
    .brand {
      padding: 24px 19px 20px;
      border-bottom: 1px solid var(--border);
    }
    .brand-top { display: flex; align-items: center; gap: 12px; }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      flex: 0 0 46px;
      border-radius: 12px;
      color: #111;
      background: linear-gradient(135deg, #f5df91, #b78a20);
      font-size: 27px;
      box-shadow: 0 4px 20px #d4af371c;
    }
    .brand-name {
      margin: 0;
      color: var(--gold-light);
      font-size: 18px;
      letter-spacing: 1.4px;
      font-weight: 850;
    }
    .brand-sub {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 1.5px;
    }
    .brand-caption {
      margin: 16px 0 0;
      color: #777783;
      font-size: 11px;
      line-height: 1.6;
    }

    .nav { padding: 17px 11px; }
    .nav-label {
      margin: 8px 10px 10px;
      color: #737380;
      font-size: 10px;
      letter-spacing: 1.5px;
      font-weight: 800;
      text-transform: uppercase;
    }
    .nav-item, .category-toggle, .sub-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      border: 1px solid transparent;
      color: #bdbdc7;
      background: transparent;
      cursor: pointer;
      transition: background .18s, color .18s, border-color .18s;
    }
    .nav-item, .category-toggle {
      min-height: 43px;
      padding: 10px 11px;
      border-radius: 8px;
    }
    .nav-item:hover, .category-toggle:hover, .sub-item:hover {
      background: var(--card-hover);
      color: #fff;
    }
    .nav-item.active {
      background: linear-gradient(90deg, #d4af371d, #d4af3708);
      color: var(--gold-light);
      border-color: #d4af3738;
    }
    .nav-icon {
      width: 23px;
      flex: 0 0 23px;
      font-size: 16px;
      text-align: center;
    }
    .nav-text { flex: 1; line-height: 1.4; }
    .chevron {
      color: #777783;
      font-size: 12px;
      transition: transform .2s;
    }
    .category-toggle[aria-expanded="true"] .chevron {
      transform: rotate(90deg);
    }
    .subnav {
      margin: 2px 0 8px 22px;
      padding-left: 12px;
      border-left: 1px solid #373740;
    }
    .sub-item {
      min-height: 34px;
      padding: 7px 9px;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.45;
    }
    .sub-item.active {
      color: var(--gold-light);
      background: #d4af3716;
    }
    .sub-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #666672;
      flex: 0 0 5px;
    }
    .sub-item.active .sub-dot { background: var(--gold); }

    .sidebar-bottom {
      margin-top: auto;
      padding: 14px;
      border-top: 1px solid var(--border);
    }
    .preview-note {
      padding: 12px;
      border: 1px solid #d4af3730;
      border-radius: 9px;
      background: #d4af370a;
    }
    .preview-note strong { color: var(--gold-light); font-size: 12px; }
    .preview-note p {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.6;
      margin: 6px 0 0;
    }

    .main { margin-left: var(--sidebar-width); min-width: 0; }
    .topbar {
      height: 72px;
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 0 28px;
      background: #0d0d10ee;
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(14px);
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .menu-button {
      display: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      background: var(--card);
      padding: 8px 10px;
      cursor: pointer;
    }
    .breadcrumb { color: var(--muted); font-size: 12px; }
    .breadcrumb strong { color: var(--gold-light); font-weight: 650; }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .preview-pill {
      padding: 7px 10px;
      border-radius: 20px;
      color: var(--gold-light);
      background: #d4af3715;
      border: 1px solid #d4af3740;
      font-size: 11px;
      white-space: nowrap;
    }
    .avatar {
      display: grid;
      place-items: center;
      width: 35px;
      height: 35px;
      border: 1px solid #d4af3760;
      border-radius: 50%;
      background: #d4af3718;
      color: var(--gold-light);
      font-weight: 800;
    }

    .content { max-width: 1500px; margin: auto; padding: 30px; }
    .eyebrow {
      color: var(--gold);
      font-size: 10px;
      letter-spacing: 2px;
      font-weight: 800;
      text-transform: uppercase;
    }
    .page-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 25px;
    }
    h1 { margin: 9px 0; font-size: clamp(25px, 3vw, 34px); letter-spacing: -.8px; }
    .page-description {
      margin: 0;
      color: var(--muted);
      max-width: 650px;
      line-height: 1.7;
    }
    .gold-line {
      height: 3px;
      width: 62px;
      margin-top: 17px;
      border-radius: 10px;
      background: linear-gradient(90deg, var(--gold), transparent);
    }
    .chess-badge {
      color: var(--gold-light);
      border: 1px solid #d4af373a;
      border-radius: 9px;
      background: #d4af370c;
      padding: 10px 12px;
      font-size: 12px;
      white-space: nowrap;
    }

    .welcome {
      position: relative;
      overflow: hidden;
      padding: 26px;
      margin-bottom: 25px;
      border: 1px solid #d4af3740;
      border-radius: 15px;
      background:
        radial-gradient(ellipse at 95% 5%, #d4af371b, transparent 42%),
        linear-gradient(120deg, #1a1917, #121216 65%);
    }
    .welcome:after {
      content: "♞";
      position: absolute;
      right: 28px;
      bottom: -38px;
      color: #d4af370c;
      font-size: 190px;
      pointer-events: none;
    }
    .welcome h2 { margin: 0 0 9px; font-size: 21px; position: relative; z-index: 1; }
    .welcome h2 span { color: var(--gold-light); }
    .welcome p {
      max-width: 650px;
      margin: 0;
      color: #b7b7c1;
      line-height: 1.7;
      position: relative;
      z-index: 1;
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 30px 0 15px;
    }
    .section-heading h2 { margin: 0; font-size: 16px; }
    .section-heading span { color: var(--muted); font-size: 11px; }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }
    .stat-card {
      min-width: 0;
      padding: 18px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      transition: transform .18s, border-color .18s;
    }
    .stat-card:hover { transform: translateY(-2px); border-color: #55555e; }
    .stat-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .stat-icon {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: #d4af3715;
      color: var(--gold-light);
      font-size: 19px;
    }
    .stat-tag { font-size: 10px; font-weight: 750; }
    .green { color: var(--green); }
    .amber { color: var(--amber); }
    .blue { color: var(--blue); }
    .stat-label { margin: 17px 0 7px; color: var(--muted); font-size: 12px; }
    .stat-value { font-size: 28px; font-weight: 800; letter-spacing: -.6px; }
    .stat-foot { margin-top: 9px; color: #7e7e8b; font-size: 10px; line-height: 1.5; }

    .two-column {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(0, .75fr);
      gap: 16px;
      margin-top: 22px;
    }
    .panel {
      min-width: 0;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
    }
    .panel h3 { margin: 0; font-size: 14px; }
    .panel-subtitle { color: var(--muted); font-size: 11px; line-height: 1.6; margin: 7px 0 17px; }
    .quick-links { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .quick-link {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 57px;
      padding: 11px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #17171c;
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }
    .quick-link:hover { border-color: #d4af3766; background: #d4af370a; }
    .quick-link .q-icon { font-size: 18px; color: var(--gold); }
    .quick-link span:last-child { font-size: 12px; line-height: 1.4; }

    .status-row {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      padding: 13px 0;
      border-bottom: 1px solid #2b2b32;
    }
    .status-row:last-child { border-bottom: 0; padding-bottom: 0; }
    .status-indicator {
      width: 9px;
      height: 9px;
      margin-top: 4px;
      flex: 0 0 9px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 12px #d4af3733;
    }
    .status-row strong { display: block; font-size: 12px; }
    .status-row p { margin: 5px 0 0; color: var(--muted); font-size: 11px; line-height: 1.5; }

    .placeholder {
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--panel);
    }
    .placeholder-icon {
      display: grid;
      place-items: center;
      width: 54px;
      height: 54px;
      border: 1px solid #d4af3740;
      border-radius: 13px;
      background: #d4af3712;
      color: var(--gold-light);
      font-size: 25px;
    }
    .placeholder h2 { margin: 18px 0 9px; font-size: 20px; }
    .placeholder p { max-width: 700px; color: var(--muted); line-height: 1.8; }
    .placeholder-label {
      display: inline-block;
      margin-top: 8px;
      padding: 7px 10px;
      color: var(--amber);
      background: #e9a23b12;
      border: 1px solid #e9a23b36;
      border-radius: 6px;
      font-size: 11px;
    }
    .option-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 20px;
    }
    .option-card {
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
    }
    .option-card .option-icon { color: var(--gold); font-size: 20px; }
    .option-card h3 { margin: 12px 0 6px; font-size: 13px; }
    .option-card p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.6; }

    .footer {
      margin-top: 35px;
      padding: 19px 0 4px;
      border-top: 1px solid var(--border);
      color: #777783;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 10px;
      font-size: 11px;
      line-height: 1.6;
    }
    .footer strong { color: var(--gold); }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 15;
      background: #0009;
    }

    @media (max-width: 1100px) {
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .content { padding: 23px; }
      .two-column { grid-template-columns: 1fr; }
      .option-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 760px) {
      :root { --sidebar-width: 280px; }
      .sidebar { transform: translateX(-102%); transition: transform .22s ease; }
      body.sidebar-open .sidebar { transform: translateX(0); }
      body.sidebar-open .overlay { display: block; }
      .main { margin-left: 0; }
      .topbar { height: 62px; padding: 0 15px; }
      .menu-button { display: inline-block; }
      .content { padding: 20px 15px; }
      .page-heading { flex-direction: column; gap: 12px; }
      .welcome { padding: 20px; }
      .welcome:after { right: -15px; font-size: 130px; }
      .stats { gap: 10px; }
      .stat-card { padding: 14px; }
      .stat-value { font-size: 24px; }
      .stat-label { line-height: 1.5; }
      .chess-badge { white-space: normal; }
      .preview-pill { display: none; }
      .option-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 400px) {
      .stats { grid-template-columns: 1fr; }
      .quick-links { grid-template-columns: 1fr; }
      .breadcrumb { font-size: 11px; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <div class="overlay" id="overlay" aria-hidden="true"></div>

    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-top">
          <div class="brand-mark" aria-hidden="true">♛</div>
          <div>
            <p class="brand-name">CHECKMAÎTRÉX</p>
            <p class="brand-sub">CHESS CLUB</p>
          </div>
        </div>
        <p class="brand-caption">Strategy. Discipline. Excellence.<br>Club Administration Portal</p>
      </div>

      <nav class="nav" id="navigation" aria-label="Admin navigation">
        <p class="nav-label">Main Menu</p>
        <button class="nav-item active" data-page="overview">
          <span class="nav-icon">◈</span><span class="nav-text">Dashboard Overview</span>
        </button>
        <div id="categoryNavigation"></div>
      </nav>

      <div class="sidebar-bottom">
        <div class="preview-note">
          <strong>♟ Preview Mode</strong>
          <p>Design preview only. Admin tools and live data are not connected yet.</p>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="menu-button" id="menuButton" aria-label="Open navigation" aria-expanded="false">☰</button>
          <div class="breadcrumb">CheckmaîtréX <span aria-hidden="true"> / </span> <strong id="breadcrumb">Dashboard Overview</strong></div>
        </div>
        <div class="top-actions">
          <span class="preview-pill">◆ Design Preview</span>
          <div class="avatar" aria-label="Admin preview avatar">C</div>
        </div>
      </header>

      <div class="content" id="content" aria-live="polite"></div>
    </main>
  </div>

  <script>
    const categories = [
      {
        id: "membership",
        icon: "♙",
        name: "Membership & User Management",
        description: "Manage membership applications, approved members, roles, and member requests.",
        options: [
          ["Membership Applications", "♧"],
          ["Approved Members", "✓"],
          ["Pending Applications", "◷"],
          ["Rejected Applications", "×"],
          ["Membership Disconnection Requests", "↗"],
          ["Member Directory", "☷"],
          ["Member Roles & Permissions", "♜"],
          ["Membership History", "◴"]
        ]
      },
      {
        id: "website",
        icon: "▣",
        name: "Website Management",
        description: "Organize website pages, navigation, appearance, media, and reusable components.",
        options: [
          ["Homepage Manager", "⌂"],
          ["Pages & Sections", "▤"],
          ["Navigation Menu Manager", "☰"],
          ["Header & Footer", "↕"],
          ["Website Appearance & Themes", "◐"],
          ["Media Library", "▧"],
          ["Gallery Manager", "▦"],
          ["Website Components", "◇"],
          ["Custom Pages", "＋"]
        ]
      },
      {
        id: "operations",
        icon: "♜",
        name: "Chess Club Operations",
        description: "Organize tournaments, events, training programs, player rankings, and results.",
        options: [
          ["Tournament Management", "♛"],
          ["Club Events", "♟"],
          ["Event Registrations", "☷"],
          ["Chess Programs & Training", "♞"],
          ["Player Rankings", "↗"],
          ["Match & Results Management", "♙"],
          ["Club Calendar", "▦"],
          ["Club Information", "ⓘ"]
        ]
      },
      {
        id: "communications",
        icon: "✉",
        name: "Content & Communications",
        description: "Manage announcements, articles, inquiries, notifications, and club feedback.",
        options: [
          ["Announcements", "◉"],
          ["News & Articles", "▤"],
          ["Featured Content", "★"],
          ["Contact Inquiries", "✉"],
          ["Notifications", "♢"],
          ["Newsletter Management", "✉"],
          ["FAQ Manager", "?"],
          ["Testimonials & Feedback", "♡"]
        ]
      },
      {
        id: "system",
        icon: "⚙",
        name: "System, Security & Analytics",
        description: "Review access, permissions, audit logs, reports, settings, and recovery tools.",
        options: [
          ["Admin Accounts", "♙"],
          ["Admin Roles & Permissions", "♜"],
          ["Activity & Audit Logs", "◷"],
          ["Website Analytics", "▥"],
          ["Reports & Exports", "⇩"],
          ["General System Settings", "⚙"],
          ["Security & Access Monitoring", "⬡"],
          ["Backup & Recovery", "◴"],
          ["Integrations & API Settings", "⌘"]
        ]
      }
    ];

    const content = document.getElementById("content");
    const categoryNavigation = document.getElementById("categoryNavigation");
    const breadcrumb = document.getElementById("breadcrumb");
    const menuButton = document.getElementById("menuButton");
    const overlay = document.getElementById("overlay");

    let currentPage = "overview";
    let expandedCategory = "membership";

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;",
        '"': "&quot;", "'": "&#39;"
      })[character]);
    }

    function renderNavigation() {
      categoryNavigation.innerHTML = categories.map(category => {
        const expanded = expandedCategory === category.id;
        const selected = category.options.some(option => option[0] === currentPage);
        return `
          <section>
            <button class="category-toggle ${selected ? "active" : ""}"
              data-category="${category.id}"
              aria-expanded="${expanded}"
              aria-controls="subnav-${category.id}">
              <span class="nav-icon">${category.icon}</span>
              <span class="nav-text">${category.name}</span>
              <span class="chevron">›</span>
            </button>
            <div class="subnav" id="subnav-${category.id}" ${expanded ? "" : "hidden"}>
              ${category.options.map(option => `
                <button class="sub-item ${currentPage === option[0] ? "active" : ""}"
                  data-page="${escapeHTML(option[0])}">
                  <span class="sub-dot"></span>
                  <span>${escapeHTML(option[0])}</span>
                </button>
              `).join("")}
            </div>
          </section>`;
      }).join("");
    }

    function overviewHTML() {
      return `
        <div class="page-heading">
          <div>
            <div class="eyebrow">Command Center / Overview</div>
            <h1>Dashboard Overview</h1>
            <p class="page-description">Welcome to the CheckmaîtréX Chess Club administration workspace. Your club's central place for future management tools.</p>
            <div class="gold-line"></div>
          </div>
          <div class="chess-badge">♛ &nbsp; Official Club Workspace</div>
        </div>

        <section class="welcome">
          <div class="eyebrow">Welcome, Administrator</div>
          <h2>Lead with <span>strategy.</span> Manage with purpose.</h2>
          <p>Keep membership, website content, club activities, and system management organized in one chess-inspired workspace. The current version is a visual layout preview.</p>
        </section>

        <div class="section-heading">
          <h2>Club Overview</h2><span>Live statistics not connected</span>
        </div>

        <section class="stats">
          <article class="stat-card">
            <div class="stat-top"><div class="stat-icon">♙</div><span class="stat-tag green">MEMBERSHIP</span></div>
            <p class="stat-label">Approved Members</p><div class="stat-value">—</div>
            <div class="stat-foot">Member totals will appear here once connected.</div>
          </article>
          <article class="stat-card">
            <div class="stat-top"><div class="stat-icon">◷</div><span class="stat-tag amber">REVIEW</span></div>
            <p class="stat-label">Pending Applications</p><div class="stat-value">—</div>
            <div class="stat-foot">Applications awaiting admin review.</div>
          </article>
          <article class="stat-card">
            <div class="stat-top"><div class="stat-icon">♛</div><span class="stat-tag blue">ACTIVITIES</span></div>
            <p class="stat-label">Club Events & Tournaments</p><div class="stat-value">—</div>
            <div class="stat-foot">Upcoming club activities and competitions.</div>
          </article>
          <article class="stat-card">
            <div class="stat-top"><div class="stat-icon">⬡</div><span class="stat-tag green">SECURITY</span></div>
            <p class="stat-label">System & Security</p><div class="stat-value">Preview</div>
            <div class="stat-foot">Security indicators are not connected to live checks.</div>
          </article>
        </section>

        <div class="two-column">
          <section class="panel">
            <h3>Quick Access</h3>
            <p class="panel-subtitle">Open a section to preview its planned workspace.</p>
            <div class="quick-links">
              <button class="quick-link" data-page="Membership Applications"><span class="q-icon">♙</span><span>Membership Applications</span></button>
              <button class="quick-link" data-page="Approved Members"><span class="q-icon">✓</span><span>Approved Members</span></button>
              <button class="quick-link" data-page="Homepage Manager"><span class="q-icon">⌂</span><span>Homepage Manager</span></button>
              <button class="quick-link" data-page="Tournament Management"><span class="q-icon">♛</span><span>Tournament Management</span></button>
              <button class="quick-link" data-page="Announcements"><span class="q-icon">◉</span><span>Announcements</span></button>
              <button class="quick-link" data-page="Website Analytics"><span class="q-icon">▥</span><span>Website Analytics</span></button>
            </div>
          </section>

          <section class="panel">
            <h3>Workspace Notes</h3>
            <p class="panel-subtitle">Current project status</p>
            <div class="status-row"><span class="status-indicator"></span><div><strong>Black & Gold Brand</strong><p>Primary club identity with subtle accent colors.</p></div></div>
            <div class="status-row"><span class="status-indicator" style="background:var(--blue)"></span><div><strong>Admin Sections</strong><p>All five categories and their planned subpages are included.</p></div></div>
            <div class="status-row"><span class="status-indicator" style="background:var(--amber)"></span><div><strong>Functionality Pending</strong><p>Database operations and admin authorization must be implemented securely later.</p></div></div>
          </section>
        </div>
        ${footerHTML()}`;
    }

    function footerHTML() {
      return `<footer class="footer"><span>© ${new Date().getFullYear()} <strong>CheckmaîtréX Chess Club</strong></span><span>Strategy · Discipline · Excellence</span></footer>`;
    }

    function pageHTML(page) {
      const category = categories.find(item => item.options.some(option => option[0] === page));
      const option = category?.options.find(item => item[0] === page);
      return `
        <div class="page-heading">
          <div>
            <div class="eyebrow">${escapeHTML(category?.name || "Administration")}</div>
            <h1>${escapeHTML(page)}</h1>
            <p class="page-description">${escapeHTML(category?.description || "Your CheckmaîtréX Chess Club administration workspace.")}</p>
            <div class="gold-line"></div>
          </div>
          <div class="chess-badge">♟ &nbsp; Planned Workspace</div>
        </div>
        <section class="placeholder">
          <div class="placeholder-icon">${option?.[1] || "♛"}</div>
          <h2>${escapeHTML(page)}</h2>
          <p>This section is part of the CheckmaîtréX Chess Club admin structure. Its interface and functionality will be built in a later phase. For now, this page is a themed placeholder and does not read or modify club data.</p>
          <span class="placeholder-label">◷ &nbsp; Functionality not connected</span>
        </section>
        <div class="section-heading"><h2>Planned Workspace</h2><span>Design preview</span></div>
        <section class="option-grid">
          <article class="option-card"><div class="option-icon">◇</div><h3>Workspace Interface</h3><p>A dedicated interface for the tools planned for this section.</p></article>
          <article class="option-card"><div class="option-icon">⬡</div><h3>Access & Permissions</h3><p>Authorization will need to be enforced securely before real operations are enabled.</p></article>
          <article class="option-card"><div class="option-icon">▤</div><h3>Data & Activity</h3><p>Any required data, records, and actions will be added in a future phase.</p></article>
        </section>
        ${footerHTML()}`;
    }

    function openPage(page) {
      currentPage = page;
      const category = categories.find(item => item.options.some(option => option[0] === page));
      if (category) expandedCategory = category.id;

      breadcrumb.textContent = page;
      content.innerHTML = page === "overview" ? overviewHTML() : pageHTML(page);
      renderNavigation();
      closeMobileMenu();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function closeMobileMenu() {
      document.body.classList.remove("sidebar-open");
      menuButton.setAttribute("aria-expanded", "false");
    }

    categoryNavigation.addEventListener("click", event => {
      const categoryButton = event.target.closest("[data-category]");
      if (categoryButton) {
        const id = categoryButton.dataset.category;
        expandedCategory = expandedCategory === id ? "" : id;
        renderNavigation();
        return;
      }
      const pageButton = event.target.closest("[data-page]");
      if (pageButton) openPage(pageButton.dataset.page);
    });

    document.getElementById("navigation").addEventListener("click", event => {
      const pageButton = event.target.closest("[data-page]");
      if (pageButton) openPage(pageButton.dataset.page);
    });

    content.addEventListener("click", event => {
      const pageButton = event.target.closest("[data-page]");
      if (pageButton) openPage(pageButton.dataset.page);
    });

    menuButton.addEventListener("click", () => {
      const isOpen = document.body.classList.toggle("sidebar-open");
      menuButton.setAttribute("aria-expanded", String(isOpen));
    });
    overlay.addEventListener("click", closeMobileMenu);
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeMobileMenu();
    });

    renderNavigation();
    openPage("overview");
  </script>
</body>
</html>
