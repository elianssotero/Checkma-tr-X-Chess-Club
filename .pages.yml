
media:
  input: media
  output: /Checkma-tr-X-Chess-Club/media

content:
  - name: highlights
    label: Club Highlights
    type: collection
    path: content/highlights
    format: json
    filename: "{primary}.json"
    view:
      primary: title
      fields:
        - title
        - category
        - date
      sort: date
      order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - Achievements
            - Club Gallery
            - News & Updates

      - name: date
        label: Date
        type: date
        required: true

      - name: image
        label: Cover Image
        type: image
        options:
          extensions:
            - jpg
            - jpeg
            - png
            - webp

      - name: body
        label: Content
        type: rich-text
        required: true
