
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0b">
  <meta name="description" content="Choose a login option for CheckmaîtréX Chess Club.">
  <title>Login Selection | CheckmaîtréX Chess Club</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="enhancements.css">
  <link rel="stylesheet" href="auth-pages.css">

<style>
  [hidden] {
    display: none !important;
  }
</style>

</head>

<body>
  <main class="auth-shell">
    <section class="auth-card">
      <div class="auth-brand">
        <div class="auth-mark" aria-hidden="true">♟</div>
        <h1>CHECKMAÎTRÉX</h1>
        <p>Chess Club</p>
      </div>

      <h2>Choose how to continue</h2>
      <p class="auth-intro" id="authMessage" aria-live="polite">
        Checking your sign-in status...
      </p>

      <div class="auth-actions">
        <!-- Makikita lang kapag walang Google session -->
        <a class="auth-action" href="google-login.html" id="googleAction" hidden>
          <span aria-hidden="true">G</span>
          <span id="googleLabel">Continue with Google</span>
        </a>

        <!-- Lalabas kapag may Google session -->
        <button class="auth-action" id="googleSignedIn" type="button" hidden>
          <span aria-hidden="true">G</span>
          <span>Signed in with Google</span>
        </button>

        <!-- Sign out control; Google section lang ang magpapakita nito -->
        <button class="auth-action secondary" id="signOutButton" type="button" hidden>
          Sign Out
        </button>

        <!-- Lalabas lang kapag naka-Google sign-in at hindi pa approved -->
        <a class="auth-action secondary" href="member-login.html" id="memberAction" hidden>
          <span aria-hidden="true">♟</span>
          Member Login
        </a>

        <!-- Status label lang; hindi napipindot -->
        <div class="auth-action secondary" id="memberSignedIn" hidden aria-live="polite">
          <span aria-hidden="true">✓</span>
          Signed in as a Member
        </div>

        <!-- Lalabas lang kung wala pang application -->
        <a class="auth-action secondary" href="membership-application.html" id="applyAction" hidden>
          Apply for Membership
        </a>
      </div>

      <p class="auth-small">
        Membership applications are reviewed by the club administration.
      </p>

      <div class="auth-links">
        <a href="index.html">Back to Home</a>
        <a href="membership.html">Membership Information</a>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const googleAction = document.getElementById("googleAction");
      const googleSignedIn = document.getElementById("googleSignedIn");
      const signOutButton = document.getElementById("signOutButton");
      const memberAction = document.getElementById("memberAction");
      const memberSignedIn = document.getElementById("memberSignedIn");
      const applyAction = document.getElementById("applyAction");
      const authMessage = document.getElementById("authMessage");

      if (!window.clubSupabase) {
        authMessage.textContent =
          "Unable to connect to the sign-in service. Please refresh the page.";
        console.error("Supabase client is not initialized.");
        return;
      }

      const supabase = window.clubSupabase;
      let currentUserId = null;
      let refreshNumber = 0;

      function hideAllActions() {
        googleAction.hidden = true;
        googleSignedIn.hidden = true;
        signOutButton.hidden = true;
        memberAction.hidden = true;
        memberSignedIn.hidden = true;
        applyAction.hidden = true;
      }

      async function updateButtons() {
        const thisRefresh = ++refreshNumber;
        hideAllActions();
        authMessage.textContent = "Checking your sign-in status...";

        const { data, error } = await supabase.auth.getSession();

        if (thisRefresh !== refreshNumber) return;

        if (error) {
          authMessage.textContent =
            "Could not check your sign-in status. Please refresh the page.";
          console.error("Session check failed:", error);
          return;
        }

        const user = data.session?.user;

        if (!user) {
          currentUserId = null;
          googleAction.hidden = false;
          authMessage.textContent =
            "Sign in with Google to access membership options.";
          return;
        }

        currentUserId = user.id;
        googleSignedIn.hidden = false;
        authMessage.textContent = "You are signed in with Google.";

        // Check whether this same Supabase user is an approved member.
        const { data: profile, error: profileError } = await supabase
          .from("member_profiles")
          .select("status")
          .eq("user_id", user.id)
          .maybeSingle();

        if (thisRefresh !== refreshNumber) return;

        if (profileError) {
  console.error("Member status check failed:", profileError);
  memberAction.hidden = false;
  authMessage.textContent =
    "Could not verify membership status: " + profileError.message;
  return;
        }

        if (profile?.status === "approved") {
          memberSignedIn.hidden = false;
          authMessage.textContent =
            "Your account is approved as a club member.";
          return;
        }

        // Not approved: allow Member Login and check application status.
        memberAction.hidden = false;

        const { data: applications, error: applicationError } = await supabase
          .from("membership_applications")
          .select("status")
          .eq("user_id", user.id)
          .order("created_at", { ascending: false })
          .limit(1);

        if (thisRefresh !== refreshNumber) return;

        if (applicationError) {
  console.error("Application status check failed:", applicationError);
  authMessage.textContent =
    "Could not check application status: " + applicationError.message;
  return;
        }

        const application = applications?.[0];

        if (!application) {
          applyAction.hidden = false;
          authMessage.textContent =
            "You are signed in. You may apply for club membership.";
        } else if (application.status === "pending") {
          authMessage.textContent =
            "Your membership application is awaiting review.";
        } else if (application.status === "rejected") {
          authMessage.textContent =
            "Your previous application was not approved. Contact the club administration for next steps.";
        } else {
          // Hide Apply if an application already exists.
          authMessage.textContent =
            "Your membership application is already recorded.";
        }
      }

      googleSignedIn.addEventListener("click", () => {
        signOutButton.hidden = !signOutButton.hidden;
      });

      signOutButton.addEventListener("click", async () => {
        const confirmed = window.confirm(
          "Are you sure you want to sign out?"
        );

        if (!confirmed) return;

        signOutButton.disabled = true;
        signOutButton.textContent = "Signing out...";

        const { error } = await supabase.auth.signOut();

        signOutButton.disabled = false;
        signOutButton.textContent = "Sign Out";

        if (error) {
          authMessage.textContent = "Sign out failed. Please try again.";
          console.error("Sign out failed:", error);
          return;
        }

        await updateButtons();
      });

      // Refresh button states after sign-in or sign-out.
      supabase.auth.onAuthStateChange((event, session) => {
        const newUserId = session?.user?.id ?? null;

        if (event === "SIGNED_IN" ||
            event === "SIGNED_OUT" ||
            newUserId !== currentUserId) {
          window.setTimeout(() => {
            updateButtons();
          }, 0);
        }
      });

      updateButtons();
    });
  </script>

  <script src="site-animations.js"></script>
  <script src="language.js"></script>
</body>
</html>
