
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0b">
  <meta name="description" content="Meet CheckmaîtréX AI, your chess learning assistant.">
  <meta name="color-scheme" content="dark light">
  <title>CheckmaîtréX AI | Chess Assistant</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0b0b;
      --panel: #151515;
      --panel-soft: #101010;
      --gold: #d4af37;
      --gold-light: #f4d879;
      --gold-dim: #8a7028;
      --text: #f5f1e5;
      --muted: #b8b3a5;
      --border: #51451f;
      --danger: #ffb4a9;
      --success: #d5e8b4;
      --radius: 12px;
      --transition: 0.2s ease;
    }

    [data-theme="light"] {
      color-scheme: light;
      --bg: #f5f3ef;
      --panel: #ffffff;
      --panel-soft: #f0eee8;
      --gold: #a8861a;
      --gold-light: #d4af37;
      --gold-dim: #8a7028;
      --text: #1a1a1a;
      --muted: #666;
      --border: #d4c9a8;
      --danger: #c44;
      --success: #4a8a2a;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at top, #302711 0%, var(--bg) 48%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
    }

    [data-theme="light"] body {
      background: radial-gradient(ellipse at top, #f0ead4 0%, var(--bg) 48%);
    }

    button, textarea { font: inherit; }

    header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background: #0b0b0bf2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    [data-theme="light"] header { background: #ffffffee; }

    .brand { display: flex; align-items: center; gap: 12px; }
    .logo { width: 38px; height: 38px; object-fit: contain; display: block; flex-shrink: 0; }
    .brand-name { color: var(--gold); font-weight: 800; letter-spacing: 1px; }
    .brand-subtitle { font-size: 12px; color: var(--muted); letter-spacing: 2px; }
    .header-actions { display: flex; align-items: center; gap: 8px; }

    .icon-btn {
      width: 38px; height: 38px; min-height: 38px;
      border: 1px solid var(--border); border-radius: 10px;
      background: var(--panel); color: var(--gold);
      font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: var(--transition);
    }
    .icon-btn:hover:not(:disabled) { border-color: var(--gold); background: #211c10; }
    [data-theme="light"] .icon-btn:hover:not(:disabled) { background: #f0ead4; }

    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5); z-index: 150;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .overlay.show { opacity: 1; pointer-events: auto; }

    .sidebar {
      position: fixed; top: 0; left: 0;
      width: 280px; height: 100vh;
      background: var(--panel);
      border-right: 1px solid var(--border);
      transform: translateX(-100%);
      transition: transform 0.3s ease;
      z-index: 200; display: flex; flex-direction: column; overflow: hidden;
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .sidebar-header strong { font-size: 0.95rem; }
    .sidebar-list { flex: 1; overflow-y: auto; padding: 8px; }

    .sidebar-item {
      padding: 10px 12px; border-radius: 10px; cursor: pointer;
      font-size: 0.88rem; color: var(--muted);
      transition: var(--transition); margin-bottom: 4px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .sidebar-item:hover { background: var(--panel-soft); color: var(--text); }
    .sidebar-item.active { background: var(--panel-soft); color: var(--gold); border-left: 3px solid var(--gold); }
    .sidebar-item .item-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .sidebar-item .del-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; padding: 2px 6px; border-radius: 4px; opacity: 0; transition: var(--transition); flex-shrink: 0; }
    .sidebar-item:hover .del-btn { opacity: 1; }
    .sidebar-item .del-btn:hover { color: var(--danger); }
    .sidebar-empty { padding: 24px 16px; text-align: center; color: var(--muted); font-size: 0.85rem; }
    .sidebar-footer { padding: 12px 16px; border-top: 1px solid var(--border); }
    .sidebar-footer .icon-btn { width: 100%; justify-content: center; gap: 6px; }
