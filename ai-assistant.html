<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CheckmaîtréX AI — Chess Assistant</title>
<meta name="description" content="CheckmaîtréX AI — Your intelligent chess coaching assistant.">
<link rel="icon" href="ai-logo.png" type="image/png">
<style>
:root {
  --bg: #0a0a0a;
  --bg-elev: #141414;
  --bg-card: #1a1a1a;
  --border: #2a2a2a;
  --border-gold: rgba(212,175,55,0.3);
  --text: #f5f5f5;
  --text-muted: #999;
  --text-dim: #666;
  --gold: #d4af37;
  --gold-light: #f4d879;
  --gold-dim: #8a7028;
  --danger: #e05555;
  --radius: 12px;
  --radius-sm: 8px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --mono: "SF Mono", "Fira Code", "Cascadia Code", Consolas, monospace;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
  --transition: 0.2s ease;
}

[data-theme="light"] {
  --bg: #f8f8f8;
  --bg-elev: #ffffff;
  --bg-card: #f0f0f0;
  --border: #ddd;
  --border-gold: rgba(180,140,20,0.35);
  --text: #1a1a1a;
  --text-muted: #555;
  --text-dim: #999;
  --gold: #b48c14;
  --gold-light: #d4af37;
  --gold-dim: #8a7028;
  --shadow: 0 4px 24px rgba(0,0,0,0.1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body { height: 100%; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* Header */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  background: var(--bg-elev);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-left { display: flex; align-items: center; gap: 12px; }

.header-logo {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 2px solid var(--gold);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}

.header-title { font-size: 1.1rem; font-weight: 700; letter-spacing: -0.02em; }
.header-title span { color: var(--gold); }

.header-actions { display: flex; align-items: center; gap: 8px; }

.icon-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-muted);
  width: 38px; height: 38px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  transition: var(--transition);
}

.icon-btn:hover { border-color: var(--gold); color: var(--gold); }

/* Chat area */
.chat-container {
  flex: 1;
  display: flex;
  flex-direction: column;
  max-width: 820px;
  width: 100%;
  margin: 0 auto;
  overflow: hidden;
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 24px 20px;
  scroll-behavior: smooth;
}

.messages::-webkit-scrollbar { width: 6px; }
.messages::-webkit-scrollbar-track { background: transparent; }
.messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.messages::-webkit-scrollbar-thumb:hover { background: var(--gold-dim); }

/* Welcome screen */
.welcome {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 48px 20px;
  min-height: 100%;
}

.welcome-logo {
  width: 72px; height: 72px;
  border-radius: 50%;
  border: 3px solid var(--gold);
  display: flex; align-items: center; justify-content: center;
  font-size: 36px;
  margin-bottom: 20px;
}

.welcome h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 8px; }
.welcome h1 span { color: var(--gold); }
.welcome p { color: var(--text-muted); font-size: 0.95rem; max-width: 420px; line-height: 1.6; margin-bottom: 28px; }

.suggestion-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 10px;
  width: 100%;
  max-width: 600px;
}

.suggestion-chip {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font-size: 0.88rem;
  transition: var(--transition);
  display: flex;
  align-items: center;
  gap: 10px;
}
.suggestion-chip:hover {
  border-color: var(--gold);
  background: var(--bg-elev);
  transform: translateY(-1px);
}
.suggestion-chip .chip-icon { font-size: 1.2rem; }

/* Messages */
.msg {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.msg-avatar {
  width: 34px; height: 34px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  border: 2px solid var(--border);
}
.msg.user .msg-avatar { background: var(--bg-card); border-color: var(--border); }
.msg.assistant .msg-avatar { background: var(--bg-elev); border-color: var(--gold); }

.msg-content {
  flex: 1;
  min-width: 0;
  padding-top: 4px;
}

.msg-content p { line-height: 1.7; margin-bottom: 10px; }
.msg-content p:last-child { margin-bottom: 0; }
.msg-content ul, .msg-content ol { margin: 8px 0 12px 20px; }
.msg-content li { margin-bottom: 4px; line-height: 1.6; }
.msg-content strong { color: var(--gold-light); font-weight: 600; }
.msg-content code {
  font-family: var(--mono);
  font-size: 0.85em;
  background: var(--bg-card);
  padding: 2px 6px;
  border-radius: 4px;
  border: 1px solid var(--border);
}
.msg-content pre {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  overflow-x: auto;
  margin: 10px 0;
}
.msg-content pre code {
  background: none;
  border: none;
  padding: 0;
  font-size: 0.85em;
  line-height: 1.5;
}

.msg-actions {
  display: flex;
  gap: 6px;
  margin-top: 8px;
  opacity: 0;
  transition: var(--transition);
}
.msg:hover .msg-actions { opacity: 1; }

.msg-action-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 0.75rem;
  cursor: pointer;
  transition: var(--transition);
}
.msg-action-btn:hover { border-color: var(--gold); color: var(--gold); }

/* Typing indicator */
.typing { display: flex; gap: 4px; padding: 8px 0; }
.typing span {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--gold-dim);
  animation: bounce 1.4s infinite;
}
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-8px); opacity: 1; }
}

/* Input area */
.input-area {
  padding: 16px 20px 20px;
  background: var(--bg-elev);
  border-top: 1px solid var(--border);
}

.input-wrapper {
  display: flex;
  gap: 10px;
  align-items: flex-end;
  max-width: 820px;
  margin: 0 auto;
}

.input-field {
  flex: 1;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 16px;
  color: var(--text);
  font-family: var(--font);
  font-size: 0.95rem;
  resize: none;
  max-height: 120px;
  min-height: 46px;
  line-height: 1.5;
  transition: var(--transition);
  outline: none;
}
.input-field:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(212,175,55,0.1); }
.input-field::placeholder { color: var(--text-dim); }

.send-btn {
  background: var(--gold);
  color: #0a0a0a;
  border: none;
  width: 46px; height: 46px;
  border-radius: var(--radius);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  transition: var(--transition);
  flex-shrink: 0;
}
.send-btn:hover { background: var(--gold-light); transform: scale(1.05); }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.send-btn.stop { background: var(--danger); color: #fff; }

.input-hint {
  text-align: center;
  font-size: 0.75rem;
  color: var(--text-dim);
  margin-top: 8px;
}

/* Error banner */
.error-banner {
  background: rgba(224,85,85,0.1);
  border: 1px solid rgba(224,85,85,0.3);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  margin-bottom: 12px;
  font-size: 0.85rem;
  color: var(--danger);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.error-banner button {
  background: none;
  border: 1px solid var(--danger);
  color: var(--danger);
  padding: 3px 10px;
  border-radius: 4px;
  font-size: 0.78rem;
  cursor: pointer;
}
.error-banner button:hover { background: rgba(224,85,85,0.15); }

/* Sidebar */
.sidebar {
  position: fixed;
  top: 0; left: 0;
  width: 280px;
  height: 100vh;
  background: var(--bg-elev);
  border-right: 1px solid var(--border);
  transform: translateX(-100%);
  transition: transform 0.3s ease;
  z-index: 200;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sidebar.open { transform: translateX(0); }

.sidebar-header {
  padding: 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.sidebar-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}

.sidebar-item {
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 0.88rem;
  color: var(--text-muted);
  transition: var(--transition);
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.sidebar-item:hover { background: var(--bg-card); color: var(--text); }
.sidebar-item.active { background: var(--bg-card); color: var(--gold); border-left: 3px solid var(--gold); }

.sidebar-item .del-btn {
  background: none;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  font-size: 14px;
  padding: 2px 6px;
  border-radius: 4px;
  opacity: 0;
  transition: var(--transition);
}
.sidebar-item:hover .del-btn { opacity: 1; }
.sidebar-item .del-btn:hover { color: var(--danger); }

.sidebar-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
}

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 150;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
.overlay.show { opacity: 1; pointer-events: auto; }

/* Responsive */
@media (max-width: 600px) {
  .header { padding: 12px 14px; }
  .messages { padding: 16px 14px; }
  .input-area { padding: 12px 14px 16px; }
  .suggestion-grid { grid-template-columns: 1fr; }
  .welcome { padding: 32px 16px; }
}

@media (min-width: 601px) {
  .menu-btn { display: none; }
}
</style>
</head>
<body>

<div class="overlay" id="overlay" onclick="toggleSidebar(false)"></div>

<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <strong style="font-size:0.95rem;">Conversations</strong>
    <button class="icon-btn" onclick="newChat()" title="New chat">+</button>
  </div>
  <div class="sidebar-list" id="convList"></div>
  <div class="sidebar-footer">
    <button class="icon-btn" style="width:100%;justify-content:center;gap:6px;" onclick="clearAllHistory()">Clear all</button>
  </div>
</div>

<header class="header">
  <div class="header-left">
    <button class="icon-btn menu-btn" onclick="toggleSidebar(true)" title="Menu">&#9776;</button>
    <div class="header-logo">&#9822;</div>
    <div class="header-title">Checkmaîtré<span>X</span> AI</div>
  </div>
  <div class="header-actions">
    <button class="icon-btn" onclick="toggleTheme()" id="themeBtn" title="Toggle theme">&#9790;</button>
    <button class="icon-btn" onclick="newChat()" title="New chat">+</button>
  </div>
</header>

<div class="chat-container">
  <div class="messages" id="messages">
    <div class="welcome" id="welcome">
      <div class="welcome-logo">&#9822;</div>
      <h1>Checkmaîtré<span>X</span> AI</h1>
      <p>Your intelligent chess coaching assistant. Ask about openings, tactics, endgames, positions, and more.</p>
      <div class="suggestion-grid" id="suggestionGrid"></div>
    </div>
  </div>
  <div class="input-area">
    <div id="errorContainer"></div>
    <div class="input-wrapper">
      <textarea class="input-field" id="input" placeholder="Ask about chess..." rows="1" onkeydown="handleKey(event)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="Send">&#8593;</button>
    </div>
    <div class="input-hint">Press Enter to send, Shift+Enter for new line</div>
  </div>
</div>

<script>
const API_URL = "https://checkmaitrex-ai.elianssotero11.workers.dev";
const STREAM_URL = API_URL + "/stream";
const SUGGESTIONS_URL = API_URL + "/suggestions";
const STORAGE_KEY = "checkmaitrex_conversations";
const THEME_KEY = "checkmaitrex_theme";

let conversations = [];
let currentConvId = null;
let isGenerating = false;
let abortController = null;

// Theme
function initTheme() {
  const saved = localStorage.getItem(THEME_KEY) || "dark";
  document.documentElement.setAttribute("data-theme", saved);
  document.getElementById("themeBtn").innerHTML = saved === "dark" ? "&#9790;" : "&#9728;";
}
function toggleTheme() {
  const current = document.documentElement.getAttribute("data-theme") || "dark";
  const next = current === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem(THEME_KEY, next);
  document.getElementById("themeBtn").innerHTML = next === "dark" ? "&#9790;" : "&#9728;";
}

// Conversations
function loadConversations() {
  try {
    conversations = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch { conversations = []; }
}

function saveConversations() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations));
  } catch {}
}

function newChat() {
  currentConvId = null;
  showWelcome();
  renderConvList();
  toggleSidebar(false);
}

function getCurrentConv() {
  if (!currentConvId) return null;
  return conversations.find(c => c.id === currentConvId);
}

function getOrCreateConv() {
  if (currentConvId) return getCurrentConv();
  currentConvId = Date.now().toString();
  const conv = { id: currentConvId, title: "New chat", messages: [], created: Date.now() };
  conversations.unshift(conv);
  return conv;
}

function renderConvList() {
  const list = document.getElementById("convList");
  list.innerHTML = "";
  if (conversations.length === 0) {
    list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-dim);font-size:0.85rem;">No saved conversations</div>';
    return;
  }
  conversations.forEach(conv => {
    const item = document.createElement("div");
    item.className = "sidebar-item" + (conv.id === currentConvId ? " active" : "");
    const titleSpan = document.createElement("span");
    titleSpan.textContent = conv.title || "New chat";
    titleSpan.style.overflow = "hidden";
    titleSpan.style.textOverflow = "ellipsis";
    titleSpan.style.whiteSpace = "nowrap";
    const delBtn = document.createElement("button");
    delBtn.className = "del-btn";
    delBtn.innerHTML = "&times;";
    delBtn.onclick = (e) => { e.stopPropagation(); deleteConv(conv.id); };
    item.appendChild(titleSpan);
    item.appendChild(delBtn);
    item.onclick = () => loadConv(conv.id);
    list.appendChild(item);
  });
}

function deleteConv(id) {
  conversations = conversations.filter(c => c.id !== id);
  if (currentConvId === id) { currentConvId = null; showWelcome(); }
  saveConversations();
  renderConvList();
}

function clearAllHistory() {
  if (!confirm("Delete all conversations?")) return;
  conversations = [];
  currentConvId = null;
  saveConversations();
  showWelcome();
  renderConvList();
}

function loadConv(id) {
  currentConvId = id;
  const conv = getCurrentConv();
  if (!conv) return;
  hideWelcome();
  const msgs = document.getElementById("messages");
  msgs.innerHTML = "";
  conv.messages.forEach(m => addMessage(m.role, m.content, false));
  renderConvList();
  toggleSidebar(false);
}

function showWelcome() {
  const msgs = document.getElementById("messages");
  msgs.innerHTML = "";
  const welcome = document.createElement("div");
  welcome.className = "welcome";
  welcome.id = "welcome";
  welcome.innerHTML = `
    <div class="welcome-logo">&#9822;</div>
    <h1>Checkmaîtré<span>X</span> AI</h1>
    <p>Your intelligent chess coaching assistant. Ask about openings, tactics, endgames, positions, and more.</p>
    <div class="suggestion-grid" id="suggestionGrid"></div>
  `;
  msgs.appendChild(welcome);
  loadSuggestions();
}

function hideWelcome() {
  const w = document.getElementById("welcome");
  if (w) w.remove();
}

// Sidebar
function toggleSidebar(open) {
  document.getElementById("sidebar").classList.toggle("open", open);
  document.getElementById("overlay").classList.toggle("show", open);
}

// Suggestions
async function loadSuggestions() {
  const grid = document.getElementById("suggestionGrid");
  if (!grid) return;
  try {
    const res = await fetch(SUGGESTIONS_URL);
    const data = await res.json();
    if (data.success && data.prompts) {
      grid.innerHTML = "";
      data.prompts.forEach(p => {
        const chip = document.createElement("button");
        chip.className = "suggestion-chip";
        const icons = { board: "&#9822;", warning: "&#9888;", book: "&#128214;", puzzle: "&#129513;", king: "&#9818;", list: "&#128221;", target: "&#127919;", graduation: "&#127893;" };
        chip.innerHTML = `<span class="chip-icon">${icons[p.icon] || "&#9822;"}</span><span>${p.label}</span>`;
        chip.onclick = () => { document.getElementById("input").value = p.text; sendMessage(); };
        grid.appendChild(chip);
      });
    }
  } catch {
    // Fallback suggestions
    const fallback = [
      { label: "Teach me an opening", text: "Teach me a chess opening" },
      { label: "Give me a puzzle", text: "Give me a chess puzzle" },
      { label: "Improve my endgame", text: "Help me improve my endgame" },
      { label: "Beginner to advanced", text: "Teach me chess from beginner to advanced" }
    ];
    grid.innerHTML = "";
    fallback.forEach(p => {
      const chip = document.createElement("button");
      chip.className = "suggestion-chip";
      chip.innerHTML = `<span class="chip-icon">&#9822;</span><span>${p.label}</span>`;
      chip.onclick = () => { document.getElementById("input").value = p.text; sendMessage(); };
      grid.appendChild(chip);
    });
  }
}

// Messages
function addMessage(role, content, save = true) {
  hideWelcome();
  const msgs = document.getElementById("messages");
  const msg = document.createElement("div");
  msg.className = "msg " + role;

  const avatar = document.createElement("div");
  avatar.className = "msg-avatar";
  avatar.innerHTML = role === "user" ? "&#128100;" : "&#9822;";

  const contentDiv = document.createElement("div");
  contentDiv.className = "msg-content";
  contentDiv.innerHTML = formatContent(content);

  // Copy button
  if (role === "assistant") {
    const actions = document.createElement("div");
    actions.className = "msg-actions";
    const copyBtn = document.createElement("button");
    copyBtn.className = "msg-action-btn";
    copyBtn.textContent = "Copy";
    copyBtn.onclick = () => {
      navigator.clipboard.writeText(content).then(() => {
        copyBtn.textContent = "Copied!";
        setTimeout(() => copyBtn.textContent = "Copy", 2000);
      });
    };
    actions.appendChild(copyBtn);
    contentDiv.appendChild(actions);
  }

  msg.appendChild(avatar);
  msg.appendChild(contentDiv);
  msgs.appendChild(msg);
  scrollToBottom();

  if (save) {
    const conv = getOrCreateConv();
    conv.messages.push({ role, content });
    if (conv.messages.length === 1) {
      conv.title = content.substring(0, 40) + (content.length > 40 ? "..." : "");
    }
    saveConversations();
    renderConvList();
  }
  return contentDiv;
}

function formatContent(text) {
  // Escape HTML
  let html = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  // Code blocks
  html = html.replace(/```([\s\S]*?)```/g, (m, code) => `<pre><code>${code.trim()}</code></pre>`);
  // Inline code
  html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
  // Bold
  html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  // Line breaks
  html = html.replace(/\n/g, "<br>");
  return html;
}

function scrollToBottom() {
  const msgs = document.getElementById("messages");
  msgs.scrollTop = msgs.scrollHeight;
}

function showError(msg, retry) {
  const container = document.getElementById("errorContainer");
  container.innerHTML = "";
  const banner = document.createElement("div");
  banner.className = "error-banner";
  banner.innerHTML = `<span>${escapeHtml(msg)}</span>`;
  if (retry) {
    const btn = document.createElement("button");
    btn.textContent = "Retry";
    btn.onclick = retry;
    banner.appendChild(btn);
  }
  container.appendChild(banner);
}

function clearError() {
  document.getElementById("errorContainer").innerHTML = "";
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// Send message
async function sendMessage() {
  const input = document.getElementById("input");
  const text = input.value.trim();
  if (!text || isGenerating) return;

  clearError();
  input.value = "";
  input.style.height = "auto";

  addMessage("user", text);
  isGenerating = true;
  updateSendButton();

  // Typing indicator
  const msgs = document.getElementById("messages");
  const typingMsg = document.createElement("div");
  typingMsg.className = "msg assistant";
  typingMsg.id = "typing-msg";
  typingMsg.innerHTML = '<div class="msg-avatar">&#9822;</div><div class="msg-content"><div class="typing"><span></span><span></span><span></span></div></div>';
  msgs.appendChild(typingMsg);
  scrollToBottom();

  // Build history
  const conv = getCurrentConv() || getOrCreateConv();
  const history = conv.messages.slice(-8, -1).map(m => ({ role: m.role, content: m.content }));

  try {
    abortController = new AbortController();
    const response = await fetch(STREAM_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, history }),
      signal: abortController.signal
    });

    if (!response.ok) {
      const errData = await response.json().catch(() => ({}));
      throw new Error(errData.error || "Request failed");
    }

    // Remove typing indicator
    document.getElementById("typing-msg")?.remove();

    // Create assistant message
    const contentDiv = addMessage("assistant", "", false);
    let fullText = "";

    // Read SSE stream
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith("data: ")) continue;
        const jsonStr = line.slice(6).trim();
        if (!jsonStr) continue;
        try {
          const data = JSON.parse(jsonStr);
          if (data.type === "text") {
            fullText += data.text;
            contentDiv.innerHTML = formatContent(fullText);
            scrollToBottom();
          } else if (data.type === "engine") {
            // Engine data received - could show separately
          } else if (data.type === "done") {
            // Stream complete
          } else if (data.type === "error") {
            throw new Error(data.error || "Stream error");
          }
        } catch (e) {
          if (e.message) throw e;
        }
      }
    }

    // Save to conversation
    conv.messages.push({ role: "assistant", content: fullText });
    saveConversations();
    renderConvList();

    // Add copy button
    const actions = document.createElement("div");
    actions.className = "msg-actions";
    const copyBtn = document.createElement("button");
    copyBtn.className = "msg-action-btn";
    copyBtn.textContent = "Copy";
    copyBtn.onclick = () => {
      navigator.clipboard.writeText(fullText).then(() => {
        copyBtn.textContent = "Copied!";
        setTimeout(() => copyBtn.textContent = "Copy", 2000);
      });
    };
    actions.appendChild(copyBtn);
    contentDiv.appendChild(actions);

  } catch (err) {
    document.getElementById("typing-msg")?.remove();
    if (err.name === "AbortError") {
      // User stopped generation
    } else {
      showError(err.message || "Something went wrong. Please try again.", () => {
        document.getElementById("input").value = text;
        sendMessage();
      });
    }
  } finally {
    isGenerating = false;
    abortController = null;
    updateSendButton();
  }
}

function updateSendButton() {
  const btn = document.getElementById("sendBtn");
  if (isGenerating) {
    btn.classList.add("stop");
    btn.innerHTML = "&#9632;";
    btn.title = "Stop";
    btn.onclick = () => {
      if (abortController) abortController.abort();
      isGenerating = false;
      updateSendButton();
    };
  } else {
    btn.classList.remove("stop");
    btn.innerHTML = "&#8593;";
    btn.title = "Send";
    btn.onclick = sendMessage;
  }
}

// Input handling
function handleKey(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

// Auto-resize textarea
document.getElementById("input").addEventListener("input", function() {
  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight, 120) + "px";
});

// Init
initTheme();
loadConversations();
renderConvList();
loadSuggestions();
</script>
<script src="bfcache-fix.js"></script>
<script src="site-animations.js"></script>

</body>
